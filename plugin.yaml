name: onbrief
version: "0.1.0"
manifest_version: 2
description: "Keeps outbound posts on the campaign brief. A pre_tool_call hook checks the text of posting and messaging tools against your rules file (required hashtags and mentions, banned words and patterns, X-weighted length, links, near-duplicates of recent posts) and blocks the call with every failing rule and a fix. Rule based, no model or network calls."
author: faze39
license: MIT
homepage: https://github.com/faze39/onbrief
requires_hermes: ">=0.23.0"
tags: [social, policy, guardrails, campaigns]
provides_tools:
  - onbrief_check
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  rules_file:
    type: str
    default: ""
    label: "Rules file"
    description: "Path to a YAML or JSON rules file. Empty uses <hermes home>/plugin-data/onbrief/rules.yaml."
  mode:
    type: str
    choices: [block, approve, warn]
    default: block
    description: "block: refuse the call. approve: send it to the Hermes approval prompt. warn: log only."
  guarded_tools:
    type: list
    default: ["*create_post*", "*create_tweet*", "*post_tweet*", "*send_tweet*", "*publish*", "*send_message*", "*send_dm*"]
    description: "Glob patterns of tool names whose text is checked (MCP tools included)."
  text_fields:
    type: list
    default: ["text", "content", "message", "body", "caption", "status", "post", "tweet"]
    description: "Argument names that hold post text, matched at any depth."
  duplicate_similarity:
    type: float
    default: 0.9
    description: "Block a post this similar (0.5 to 1.0) to one sent in the window."
  duplicate_window_days:
    type: int
    default: 30
    description: "How many days of sent posts to compare against (0 = all remembered)."
